# ACTA -- continuous integration for the PUBLIC repository.
#
# WHAT THIS BUYS: the runner is a FRESH CLONE with no instructions workbook and no leftover outputs,
# which is the one state a development machine can never reproduce. It is also the first signal
# anyone looks for before trusting
# an analysis tool.
#
# TWO JOBS, deliberately split by cost:
#   `suite`  -- every push and PR. The gates take ~15 s once dependencies are cached.
#   `oq`     -- weekly, and on demand. The three diagnostic cases each take minutes and the report
#               needs LaTeX, so running them per-push would make CI something people skip.
#
# The dependency install is the slow part (the Bioconductor flow stack is large: 20-40 min cold,
# a few minutes warm). r-lib/actions caches it on the lockfile-free path by hashing the resolved
# package list, which is the best available while there is no renv.lock -- see the note in the
# README about recorded versions.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"          # Mondays, 04:17 UTC -- the weekly OQ run
  workflow_dispatch:

jobs:
  suite:
    name: gates (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the fast default; macOS is included because it is what most flow cytometry
        # analysts actually run, and it is where the XQuartz/tcltk dependency of flowMeans bites.
        os: [ubuntu-latest, macos-latest]
        r: ["release"]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The authoritative list is `listOfLibrary` in ACTA_Script_*.R; these are the names needed
          # to SOURCE the helpers and run the gates, which is a subset -- the gates do not gate.
          packages: |
            any::flowCore
            any::flowWorkspace
            any::openCyto
            any::ggcyto
            any::flowMeans
            any::flowClust
            any::dplyr
            any::tidyr
            any::purrr
            any::ggplot2
            any::ggplate
            any::readxl
            any::openxlsx
            any::this.path
            any::knitr
            any::kableExtra
            any::diptest
            any::mclust
            any::jsonlite
            any::shiny
            any::processx
            any::magick
            any::lubridate
            any::stringr
      - name: run the gates
        run: Rscript tests/run_all.R

  oq:
    name: diagnostic cases (OQ)
    # Weekly and on demand only. A dependency break in the flow stack shows up here first -- which
    # is what partly compensates for shipping without a lockfile.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::flowCore
            any::flowWorkspace
            any::openCyto
            any::ggcyto
            any::flowMeans
            any::flowClust
            any::dplyr
            any::tidyr
            any::purrr
            any::ggplot2
            any::ggplate
            any::readxl
            any::openxlsx
            any::this.path
            any::knitr
            any::kableExtra
            any::diptest
            any::mclust
            any::jsonlite
            any::rmarkdown
            any::lubridate
            any::stringr
      - name: run the three diagnostic cases
        run: |
          Rscript -e '
            h <- new.env(); sys.source("ACTA_Functions.R", envir = h)
            bad <- character(0)
            for (n in 1:3) {
              d <- sprintf("Diagnostics/OQ_Test%d", n)
              r <- h$actaOQRun(d, quiet = TRUE)
              st <- vapply(r$recs, function(x) as.character(x$status), character(1))
              cat(sprintf("%s: %s  (%d records, %d fail)\n", d, as.character(r$verdict),
                          length(st), sum(st == "fail")))
              # A verdict of "PASS (with notes)" is acceptable: warn/skip records are legitimate
              # (a package-version drift note, for instance). Only a hard fail breaks the build.
              if (any(st == "fail")) bad <- c(bad, d)
            }
            if (length(bad)) { cat("FAILED:", paste(bad, collapse = ", "), "\n"); quit(status = 1) }
          '
