# ACTA -- continuous integration for the PUBLIC repository.
#
# WHAT THIS BUYS: the runner is a FRESH CLONE with no instructions workbook and no leftover outputs,
# which is the one state a development machine can never reproduce. It is also the first signal
# anyone looks for before trusting
# an analysis tool.
#
# TWO JOBS, deliberately split by cost:
#   `suite`  -- every push and PR. The gates take ~15 s once dependencies are cached.
#   `oq`     -- weekly, and on demand. The three diagnostic cases each take minutes and the report
#               needs LaTeX, so running them per-push would make CI something people skip.
#
# The dependency install is the slow part (the Bioconductor flow stack is large: 20-40 min cold,
# a few minutes warm). r-lib/actions caches it on the lockfile-free path by hashing the resolved
# package list, which is the best available while there is no renv.lock -- see the note in the
# README about recorded versions.
name: tests

# LEAST PRIVILEGE. No job here writes to the repository -- they check out, install and run
# gates -- so the token does not need write access to anything. Without this block GITHUB_TOKEN
# inherits whatever the repository default is, which for an older repo is read/write on every
# scope.
#
# ACTIONS ARE STILL ON MUTABLE MAJOR TAGS (@v4, @v2) rather than commit SHAs. Pinning needs the
# real SHAs, which cannot be resolved offline, and a guessed SHA breaks CI outright -- strictly
# worse than the tag. Do it from a session with network access:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag> --jq .object.sha
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"          # Mondays, 04:17 UTC -- the weekly OQ run
  workflow_dispatch:

jobs:
  suite:
    name: gates (${{ matrix.os }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the fast default; macOS is included because it is what most flow cytometry
        # analysts actually run, and it is where the XQuartz/tcltk dependency of flowMeans bites.
        #
        # WINDOWS ADDED 3.0.14, and it was overdue. This project ships Setup.bat and ACTA App.bat,
        # the README documents a Windows route, and NOTHING here ever ran there -- so six separate
        # path-handling code paths were inert on Windows for releases at a time and a security
        # review had to find it by reading. Windows is where path.expand("~") is the DOCUMENTS
        # folder rather than the profile root and where R hands back backslashes, which is exactly
        # the class of bug no amount of ubuntu and macOS green can see.
        #
        # MACOS IS PINNED TO 4.5, and it is a workaround with a shelf life. CRAN has begun shipping
        # its macOS binaries ZSTD-compressed -- still named .tgz -- and pkgdepends only recognises
        # gzip, zip, bzip2 and xz, so pak aborts with "unknown archive type" on the first zstd one
        # it reaches. That is upstream on both sides and nothing here can route around it: the
        # failure is in the dependency install, before a line of ACTA runs. It is a ROLLING
        # migration, so it arrives package by package as CRAN rebuilds -- on 2026-09-20 knitr 1.52,
        # xfun 0.61 and readxl 1.5.0.1 were zstd while dplyr, ggplot2 and ten others were still
        # gzip, which is why this broke between two releases three days apart with no change here.
        # The 4.5 binaries are gzip throughout, verified against CRAN the same day.
        # R 4.6 IS STILL COVERED, by ubuntu and windows; what this gives up is the macOS-times-4.6
        # cell, not R 4.6. REVERT TO "release" once pkgdepends detects zstd -- as of the same date
        # neither its NEWS nor its main branch does (see detect_package_archive_type in
        # R/install-tar.R), so check there rather than guessing from a pak version bump.
        os: [ubuntu-latest, windows-latest]
        r: ["release"]
        include:
          - os: macos-latest
            r: "4.5"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      # DECLARED, not inherited. The runner images happen to ship a pandoc today, but
      # test_arg_safety.R SKIPS its LaTeX-injection canary when pandoc is missing -- a security
      # assertion that quietly stops running is worse than one that fails, so pin it here.
      - uses: r-lib/actions/setup-pandoc@v2
      # AND A TeX ENGINE, restored in 3.1.5 once the three tests that depend on this job NOT
      # having one were guarded. The order matters and doing it the other way round is what turned
      # all three runners red in v3.1.0:
      #   * test_app_support.R's broken-PATH tlmgr scenario is POSIX-only -- the fault was a PATH
      #     that hid perl, and on Windows TeX Live and TinyTeX ship their own;
      #   * its LaTeX-package control now probes the `latex` base bundle, which every distribution
      #     has, instead of the report's list, which a MINIMAL TinyTeX legitimately lacks;
      #   * test_arg_safety.R's LaTeX-injection canary now FAILS on a render that does not happen
      #     and prints a whole-file SKIP banner when no PDF text extractor is present, instead of
      #     printing "[skip]" and letting the file report PASS.
      # With those in place the engine buys back the canary -- the assertion guarding the finding
      # where a workbook cell could \input an arbitrary file into the report, which had been
      # standing down silently on every runner.
      - uses: r-lib/actions/setup-tinytex@v2
      # THE LINK LIBRARIES flowCore NEEDS WHEN IT IS BUILT FROM SOURCE, which on Linux is whenever
      # P3M has no binary for the current R. flowCore links Rhdf5lib's STATIC libhdf5, and that
      # pulls `-lcurl -lssl -lcrypto` into the link line even though nothing in flowCore's own
      # SystemRequirements mentions them -- so pak's sysreqs resolution does not install them and
      # the build dies at
      #     /usr/bin/ld: cannot find -lcurl: No such file or directory
      # The runner image ships the RUNTIME libcurl4 but not the -dev package that provides the
      # linkable .so, which is the whole difference.
      # WHY THIS WAS ONLY EVER SEEN WEEKLY: setup-r-dependencies caches by hashed package list, and
      # GitHub evicts a cache untouched for 7 days. `suite` runs on every push so its cache stays
      # warm and it reuses an already-built flowCore; `oq` runs exactly weekly, lands on the
      # eviction boundary, rebuilds from source every time, and had therefore NEVER passed on a
      # schedule. That makes this a latent failure in `suite` too -- one quiet week and it goes red
      # the same way -- so the step is on both jobs, not just the one that showed it.
      - name: link libraries for a source build of flowCore
        if: runner.os == 'Linux'
        run: sudo apt-get -y update && sudo apt-get -y install libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # The authoritative list is `listOfLibrary` in ACTA_Script_*.R; these are the names needed
          # to SOURCE the helpers and run the gates, which is a subset -- the gates do not gate.
          # NOTHING BUT `any::<pkg>` LINES BELOW THIS POINT. `packages: |` is a YAML block scalar, so a
          # `#` inside it is not a comment -- it is literal text, and setup-r-dependencies splits the
          # whole string on whitespace. Two comment lines placed in there once became 29 bogus package
          # refs and pak aborted on `#`, breaking the job on both runners. Explanations go out here.
          #
          # magrittr, rmarkdown, tibble, tidyselect, tinytex, xml2 and zip are DESCRIPTION Imports, needed
          # because this job runs `R CMD INSTALL .`. They arrive transitively on ubuntu and did not on
          # macOS, so v3.0 passed on one runner and failed on the other.
          #
          # remotes is a DEV tool, not a dependency: test_install_path.R asks remotes itself whether
          # our DESCRIPTION makes it consult the Bioconductor repos. Without it that gate stands down
          # to a structural check and the end-to-end closure proof does not run at all.
          #
          # pdftools reads the probe PDF back for test_arg_safety.R's LaTeX-injection canary.
          # Without it the canary falls through to pdftotext, which is on none of the three images,
          # and then to a whole-file SKIP -- so that assertion only actually runs where this is
          # declared. It is a DEV tool, like remotes: not a dependency of the package.
          #
          # BiocManager and rstudioapi are DESCRIPTION *Suggests* and were declared nowhere, so they
          # were genuinely absent on the runner -- and the pipeline script installs what it finds
          # missing. A gate therefore reached the network and mutated the library on every push:
          # 20 of test_app_package.R's 20 seconds, and the macOS red in run #16, which was that
          # install's message arriving where a test expected something else.
          packages: |
            any::flowCore
            any::flowWorkspace
            any::openCyto
            any::ggcyto
            any::flowMeans
            any::flowClust
            any::dplyr
            any::tidyr
            any::ggplot2
            any::ggplate
            any::readxl
            any::openxlsx
            any::this.path
            any::knitr
            any::kableExtra
            any::diptest
            any::mclust
            any::jsonlite
            any::shiny
            any::processx
            any::remotes
            any::BiocManager
            any::rstudioapi
            any::ragg
            any::sessioninfo
            any::magick
            any::pdftools
            any::lubridate
            any::stringr
            any::magrittr
            any::rmarkdown
            any::tibble
            any::tidyselect
            any::tinytex
            any::xml2
            any::zip
            any::yaml
      # INSTALL THE PACKAGE FIRST, when this release IS one. test_app_package.R drives the Shiny
      # app against the installed namespace, where it can see only the exported names -- and it
      # SKIPS if the package is absent. Without this step that gate would be inert on every runner,
      # which is the same trap the CI-declares check fell into. No-op for the flat release.
      - name: install the package (package layout only)
        # shell: bash EVERYWHERE, because windows-latest defaults to pwsh and `[ -f ... ]` is not
        # PowerShell. Git Bash ships on the Windows runner, so one script serves all three.
        shell: bash
        run: |
          if [ -f DESCRIPTION ]; then R CMD INSTALL . ; else echo "flat layout, nothing to install"; fi
      - name: run the gates
        # LAYOUT-AGNOSTIC. The flat release keeps the gates at tests/; the package release keeps
        # them at tests/legacy/, because R CMD check runs tests/*.R and these need FCS and minutes.
        # One workflow serves both lines rather than forking it per release.
        shell: bash
        run: |
          f=tests/run_all.R; [ -f "$f" ] || f=tests/legacy/run_all.R
          echo "running $f"
          Rscript "$f"

  secrets:
    name: secret scan (observation only)
    runs-on: ubuntu-latest
    # NON-BLOCKING ON PURPOSE, and this is the same promotion path report-windows took.
    #
    # The BLOCKING half of this check already exists and runs where it matters: the credential
    # gate in make_public_release.sh sweeps every staged text file for provider key formats and
    # key material, and REFUSES the build on a hit. That one is verifiable on a laptop -- it was
    # tested against five planted credential shapes and against the real tree (125 files, 0
    # findings) before it went in.
    #
    # This job is the complement: a generic scanner with rules nobody here maintains, over the
    # git HISTORY as well as the tree, which the release gate cannot see. It starts
    # continue-on-error because NOTHING HERE HAS EVER RUN IT -- the fixtures deliberately contain
    # credential-ish strings (a fake submitter address, and synthetic home-directory paths in the
    # diagnostics tests) and an unknown number of them will trip default rules. Turning that
    # into a required check sight-unseen is how v3.1.0's CI went red on a tag.
    #
    # TO PROMOTE IT: read the first few runs, add an allowlist for the fixture strings it names,
    # and once it has been green on three runs it did not choose -- scheduled, not pushes -- drop
    # continue-on-error. Same bar report-windows had to clear.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # history too; the release gate only ever sees the tree
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  oq:
    name: diagnostic cases (OQ)
    # Weekly and on demand only. A dependency break in the flow stack shows up here first -- which
    # is what partly compensates for shipping without a lockfile.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      # rmarkdown SHELLS OUT to pandoc, so without it the report does not render at all -- not even
      # a failed LaTeX pass. TinyTeX alone is not enough.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      # THE LINK LIBRARIES flowCore NEEDS WHEN IT IS BUILT FROM SOURCE, which on Linux is whenever
      # P3M has no binary for the current R. flowCore links Rhdf5lib's STATIC libhdf5, and that
      # pulls `-lcurl -lssl -lcrypto` into the link line even though nothing in flowCore's own
      # SystemRequirements mentions them -- so pak's sysreqs resolution does not install them and
      # the build dies at
      #     /usr/bin/ld: cannot find -lcurl: No such file or directory
      # The runner image ships the RUNTIME libcurl4 but not the -dev package that provides the
      # linkable .so, which is the whole difference.
      # WHY THIS WAS ONLY EVER SEEN WEEKLY: setup-r-dependencies caches by hashed package list, and
      # GitHub evicts a cache untouched for 7 days. `suite` runs on every push so its cache stays
      # warm and it reuses an already-built flowCore; `oq` runs exactly weekly, lands on the
      # eviction boundary, rebuilds from source every time, and had therefore NEVER passed on a
      # schedule. That makes this a latent failure in `suite` too -- one quiet week and it goes red
      # the same way -- so the step is on both jobs, not just the one that showed it.
      - name: link libraries for a source build of flowCore
        if: runner.os == 'Linux'
        run: sudo apt-get -y update && sudo apt-get -y install libcurl4-openssl-dev libssl-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # DECLARE EVERYTHING listOfLibrary NAMES, here most of all: this is the job that actually
          # runs the pipeline, and the pipeline installs whatever requireNamespace cannot find.
          # BiocManager and rstudioapi were missing from both jobs; fixing only `suite` left the
          # weekly run still resolving two package names against the runner's default repo,
          # unpinned, and library()ing them into the session that then performs the analysis.
          packages: |
            any::flowCore
            any::flowWorkspace
            any::openCyto
            any::ggcyto
            any::flowMeans
            any::flowClust
            any::dplyr
            any::tidyr
            any::ggplot2
            any::ggplate
            any::readxl
            any::openxlsx
            any::this.path
            any::knitr
            any::kableExtra
            any::diptest
            any::mclust
            any::jsonlite
            any::rmarkdown
            any::lubridate
            any::stringr
            any::xml2
            any::zip
            any::BiocManager
            any::rstudioapi
            any::ragg
            any::sessioninfo
      - name: run the three diagnostic cases
        run: |
          Rscript -e '
            # Same two layouts: helpers at the root (flat) or under R/ (package); cases in
            # Diagnostics/ or inst/extdata/oq_small/; and in the package layout the code lives
            # apart from the data, so actaOQRun needs code_dir.
            fn  <- if (file.exists("ACTA_Functions.R")) "ACTA_Functions.R" else "R/ACTA_Functions.R"
            cas <- if (dir.exists("Diagnostics")) "Diagnostics" else "inst/extdata/oq_small"
            cd  <- if (dir.exists("inst/pipeline")) "inst/pipeline" else NULL
            cat("helpers:", fn, " cases:", cas, "\n")
            h <- new.env(); sys.source(fn, envir = h)
            bad <- character(0)
            for (n in 1:3) {
              d <- sprintf("%s/OQ_Test%d", cas, n)
              r <- if (is.null(cd)) h$actaOQRun(d, quiet = TRUE)
                   else h$actaOQRun(d, code_dir = cd, quiet = TRUE)
              st <- vapply(r$recs, function(x) as.character(x$status), character(1))
              cat(sprintf("%s: %s  (%d records, %d fail)\n", d, as.character(r$verdict),
                          length(st), sum(st == "fail")))
              # A verdict of "PASS (with notes)" is acceptable: warn/skip records are legitimate
              # (a package-version drift note, for instance). Only a hard fail breaks the build.
              if (any(st == "fail")) bad <- c(bad, d)
            }
            if (length(bad)) { cat("FAILED:", paste(bad, collapse = ", "), "\n"); quit(status = 1) }
          '

  report-windows:
    name: report renders on Windows (from a spaced path)
    # BLOCKING SINCE 2026-10-12. It was continue-on-error from the day it was added, deliberately:
    # "an untestable new workflow job is how v3.1.0's CI went red on a tag", and nothing about a
    # first run on a platform nobody had rendered a report on was predictable. The condition set
    # then for promoting it was a green on a SCHEDULE IT DID NOT CHOOSE -- not a push, not a
    # dispatch, both of which someone picks the moment for.
    # That is now met three times over: 2026-09-28, 10-05 and 10-12, all on 87acf109, all green,
    # alongside `oq` passing the same three after its -lcurl fix. It also earned the promotion
    # rather than merely surviving: while non-blocking it caught the inverted verdict that shipped
    # in v3.2.4, where the render PASSED and the job reported "the fix is NOT working here".
    # Observed long enough; it gates now.
    # EVERY EVENT, deliberately -- and this was schedule-and-dispatch-only until 3.2.6, on the
    # reasoning that a ten-minute job "is one people learn to ignore". The cost of that was
    # measured: it meant the job did not run for two releases, and v3.2.4 shipped an INVERTED
    # verdict in it that reported "the fix is NOT working here" on a run whose report had rendered
    # perfectly. Nothing caught it because nothing executed it. A gate that never runs is worse
    # than one that fails, which is the same lesson the dashboard run-scan gate taught.
    # Ten minutes per push, and since 2026-10-12 it BLOCKS -- it is a real gate now, not an
    # observation. `oq` is still NOT promoted to every event: that one is 15 minutes cold, needs
    # the whole flow stack, and is the job whose cost this reasoning was actually about.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { r-version: release, use-public-rspm: true }
      # rmarkdown SHELLS OUT to pandoc; TinyTeX alone gets no render at all, not even a failed one.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # THE `oq` JOB'S LIST, plus magrittr, tibble, tidyselect and tinytex. Same reason as the
          # note in `suite`: they are DESCRIPTION Imports that arrive transitively on ubuntu and
          # have not always arrived elsewhere -- and anything missing here does not merely fail,
          # it makes the pipeline install it mid-run, unpinned, into the library performing the
          # analysis. Whatever this job proves about a render has to be about the render.
          # NOTHING BUT `any::<pkg>` LINES BELOW THIS POINT -- see the note in `suite`.
          packages: |
            any::flowCore
            any::flowWorkspace
            any::openCyto
            any::ggcyto
            any::flowMeans
            any::flowClust
            any::dplyr
            any::tidyr
            any::ggplot2
            any::ggplate
            any::readxl
            any::openxlsx
            any::this.path
            any::knitr
            any::kableExtra
            any::diptest
            any::mclust
            any::jsonlite
            any::rmarkdown
            any::lubridate
            any::stringr
            any::xml2
            any::zip
            any::BiocManager
            any::rstudioapi
            any::ragg
            any::sessioninfo
            any::magrittr
            any::tibble
            any::tidyselect
            any::tinytex
      - name: render an OQ case from a path with a space in it
        # WHY A SCRIPT AND NOT A `run:` BLOCK. This job exists because no report had ever been
        # rendered on Windows by CI, and the recorded risk is a new job that cannot be tried
        # first. tests/legacy/ci_report_render.R runs on a laptop; a `run:` block only ever runs
        # here. It also has to stage the case under a directory whose name CONTAINS A SPACE --
        # actaRenderStage() is a no-op without one, so a job run in the D:\a\<repo>\<repo>
        # workspace would pass while executing none of the mechanism. The script asserts the
        # space is there before it runs, so it cannot be green and inert.
        shell: bash
        run: |
          f=tests/ci_report_render.R; [ -f "$f" ] || f=tests/legacy/ci_report_render.R
          if [ ! -f "$f" ]; then
            echo "no ci_report_render.R in this release -- nothing to run"
            exit 0
          fi
          echo "running $f"
          Rscript "$f" OQ_Test1
